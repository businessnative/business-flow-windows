[[permission]]
identifier = "business-flow-commands"
description = "Commands the local settings window may call. No remote access."
commands.allow = [
  "get_state",
  "save_settings",
  "set_api_key",
  "test_api_key",
  "clear_history",
  "paste_history_item",
  "toggle_dictation",
  "set_named_secret",
  "preview_meetings",
  "list_meeting_notes",
  "request_meeting_join",
  "polish_now",
  "learn_correction",
]
