[package]
name = "bnflow-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent dictation core ported from the Business Flow Mac app"
license = "MIT"
authors = ["Business Native Community"]
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
