[package]
name = "business-flow"
version = "0.2.0"
edition = "2021"
description = "Business Flow — dictation-only desktop app (BYOK)"
authors = ["Business Native Community"]
license = "MIT"
publish = false
default-run = "business-flow"

[lib]
name = "business_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
arboard = "3"
bnflow-core = { path = "../crates/bnflow-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cpal = "0.15"
dirs = "6"
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
rdev = { version = "0.5", features = ["unstable_grab"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
rdev = { version = "0.5", features = ["unstable_grab"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
rdev = { version = "0.5" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
